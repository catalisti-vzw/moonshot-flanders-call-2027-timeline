<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonshot Flanders — Call 2027 Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="page">
    <section id="stage" class="stage" aria-labelledby="timelineTitle">
      <h1 id="timelineTitle" class="visually-hidden">Moonshot Flanders — Call 2027 timeline</h1>

      <!-- Top left: today's date and the next milestone -->
      <div class="today-badge" aria-live="polite">
        <span class="today-label">TODAY</span>
        <time id="currentDate" class="current-date">—</time>
        <span id="currentPhase" class="current-phase"></span>
      </div>

      <svg id="scene" viewBox="0 0 1200 720" role="group" aria-label="Rocket trajectory from Earth to the Moon, with the phases of Call 2027 marked along the path">
        <!-- Bottom left: the two overlapping ovals (house style) -->
        <g id="earth" aria-hidden="true">
          <circle cx="0" cy="720" r="150" class="oval"/>
          <circle cx="25" cy="695" r="150" class="oval"/>
        </g>

        <!-- Top right: the moon, centred on the corner so only a quarter is visible
             (drawn moon is shown until assets/moon.webp has loaded) -->
        <g id="moon" aria-hidden="true">
          <g id="moonFallback">
            <circle cx="1200" cy="0" r="230" fill="#DDDDDD"/>
            <circle cx="1100" cy="50" r="26" fill="#B8B8B8"/>
            <circle cx="1160" cy="140" r="18" fill="#C4C4C4"/>
            <circle cx="1045" cy="120" r="12" fill="#B8B8B8"/>
            <circle cx="1150" cy="30" r="11" fill="#C4C4C4"/>
            <circle cx="1090" cy="175" r="9" fill="#C4C4C4"/>
          </g>
          <image id="moonImage" href="assets/moon.webp" x="970" y="-230" width="460" height="460"
                 preserveAspectRatio="xMidYMid meet" hidden/>
        </g>

        <!-- Trajectory: dotted orange line from the Earth onto the Moon, with the travelled part drawn solid on top -->
        <g aria-hidden="true">
        <path id="trajectory" class="trajectory" d="M 140 575 Q 560 20 1055 140"/>
        <path id="progress" class="progress" d="M 140 575 Q 560 20 1055 140"/>
        </g>

        <!-- Phase dots + labels are generated by script.js -->
        <g id="phases" class="phases-g"></g>

        <!-- Rocket, positioned by script.js. Both versions point to the right (0°). -->
        <g id="rocket" aria-hidden="true">
          <g id="rocketFallback">
            <path class="flame" d="M -13 -5 L -27 0 L -13 5 Z"/>
            <path class="rocket-body" d="M 24 0 C 16 -10 0 -12 -13 -8 L -13 8 C 0 12 16 10 24 0 Z"/>
            <path class="rocket-body" d="M -5 -9 L -17 -19 L -13 -8 Z"/>
            <path class="rocket-body" d="M -5 9 L -17 19 L -13 8 Z"/>
            <circle cx="7" cy="0" r="4" fill="#FFFFFF"/>
          </g>
          <!-- assets/rocket.png (Moonshot rocket) points up-right at about 54°, so it is turned to point right -->
          <image id="rocketImage" href="assets/rocket.png" x="-38" y="-38" width="76" height="76"
                 transform="rotate(54)" preserveAspectRatio="xMidYMid meet" hidden/>
        </g>
      </svg>

      <div id="tooltip" class="tooltip" role="tooltip" hidden>
        <div class="tt-date"></div>
        <div class="tt-title"></div>
        <div class="tt-text"></div>
      </div>
    </section>

    <!-- Text version of the timeline, shown on small screens where the SVG labels get too small -->
    <section class="key-dates" aria-labelledby="keyDatesTitle">
      <h2 id="keyDatesTitle" class="key-dates-title">Key dates — Call 2027</h2>
      <ol id="phaseList" class="phase-list"></ol>
    </section>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
