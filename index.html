<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonshot Flanders — Call 2027 Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="page">
    <section id="stage" class="stage" aria-labelledby="timelineTitle">
      <h1 id="timelineTitle" class="visually-hidden">Moonshot Flanders — Call 2027 timeline</h1>

      <!-- Today's date and the current stage, above the drawing -->
      <div class="today-badge" aria-live="polite">
        <span class="today-label">TODAY</span>
        <time id="currentDate" class="current-date">—</time>
        <span id="currentPhase" class="current-phase"></span>
      </div>

      <!-- On small screens the drawing keeps its width and can be scrolled sideways -->
      <div id="sceneScroll" class="scene-scroll">
      <svg id="scene" viewBox="0 0 1200 400" role="group" aria-label="Rocket trajectory from Earth to the Moon, with the phases of Call 2027 marked along the path">
        <!-- Left: the two overlapping ovals (house style), partly off the left edge -->
        <g id="earth" aria-hidden="true">
          <circle cx="-45" cy="272" r="150" class="oval oval-a"/>
          <circle cx="-20" cy="247" r="150" class="oval oval-b"/>
        </g>

        <!-- Right: the moon, partly off the right edge. The moon is drawn around (1200,0) and
             moved into place by the transform (drawn moon is shown until assets/moon.webp has
             loaded; its craters cover the whole disc so it looks right while turning) -->
        <g id="moon" aria-hidden="true" transform="translate(1290,210) scale(0.65) translate(-1200,0)">
          <g class="moon-spin">
          <g id="moonFallback">
            <circle cx="1200" cy="0" r="230" fill="#DDDDDD"/>
            <circle cx="1169" cy="85" r="26" fill="#B8B8B8"/>
            <circle cx="1083" cy="117" r="18" fill="#C4C4C4"/>
            <circle cx="1186" cy="159" r="12" fill="#B8B8B8"/>
            <circle cx="1144" cy="21" r="11" fill="#C4C4C4"/>
            <circle cx="1017" cy="67" r="9" fill="#B8B8B8"/>
            <circle cx="1087" cy="-41" r="15" fill="#C4C4C4"/>
            <circle cx="1176" cy="-66" r="20" fill="#B8B8B8"/>
            <circle cx="1088" cy="-134" r="12" fill="#C4C4C4"/>
            <circle cx="1226" cy="-148" r="22" fill="#B8B8B8"/>
            <circle cx="1300" cy="-173" r="10" fill="#C4C4C4"/>
            <circle cx="1273" cy="-61" r="13" fill="#B8B8B8"/>
            <circle cx="1374" cy="-63" r="16" fill="#C4C4C4"/>
            <circle cx="1322" cy="44" r="24" fill="#B8B8B8"/>
            <circle cx="1345" cy="145" r="11" fill="#C4C4C4"/>
            <circle cx="1238" cy="65" r="14" fill="#B8B8B8"/>
            <circle cx="1247" cy="174" r="9" fill="#C4C4C4"/>
            <circle cx="1162" cy="-14" r="8" fill="#B8B8B8"/>
            <circle cx="1055" cy="0" r="10" fill="#C4C4C4"/>
          </g>
          <image id="moonImage" href="assets/moon.webp" x="970" y="-230" width="460" height="460"
                 preserveAspectRatio="xMidYMid meet" hidden/>
          </g>
        </g>

        <!-- Trajectory: dotted orange line from the Earth onto the Moon, with the travelled part drawn solid on top -->
        <g aria-hidden="true">
        <path id="trajectory" class="trajectory" d="M 112 250 Q 620 40 1152 215"/>
        <path id="progress" class="progress" d="M 112 250 Q 620 40 1152 215"/>
        </g>

        <!-- Phase dots, lines and labels are generated by script.js -->
        <g id="phases" class="phases-g"></g>

        <!-- Rocket, positioned by script.js. Both versions point to the right (0°). -->
        <g id="rocket" aria-hidden="true">
          <!-- script.js moves #rocket along the path; .rocket-float adds the gentle floating motion -->
          <g class="rocket-float">
          <!-- Exhaust puffs drifting away behind the rocket -->
          <g class="exhaust">
            <circle class="puff" cx="-30" cy="0" r="5"/>
            <circle class="puff" cx="-30" cy="0" r="5"/>
            <circle class="puff" cx="-30" cy="0" r="5"/>
          </g>
          <g id="rocketFallback">
            <path class="flame" d="M -13 -5 L -27 0 L -13 5 Z"/>
            <path class="rocket-body" d="M 24 0 C 16 -10 0 -12 -13 -8 L -13 8 C 0 12 16 10 24 0 Z"/>
            <path class="rocket-body" d="M -5 -9 L -17 -19 L -13 -8 Z"/>
            <path class="rocket-body" d="M -5 9 L -17 19 L -13 8 Z"/>
            <circle cx="7" cy="0" r="4" fill="#FFFFFF"/>
          </g>
          <!-- assets/rocket.png (Moonshot rocket) points up-right at about 54°, so it is turned to point right -->
          <image id="rocketImage" href="assets/rocket.png" x="-38" y="-38" width="76" height="76"
                 transform="rotate(54)" preserveAspectRatio="xMidYMid meet" hidden/>
          </g>
        </g>
      </svg>
      </div>

      <div id="tooltip" class="tooltip" role="tooltip" hidden>
        <div class="tt-date"></div>
        <div class="tt-title"></div>
        <div class="tt-text"></div>
      </div>
    </section>

    <!-- Text version of the timeline with the full descriptions, shown on small screens -->
    <section class="key-dates" aria-labelledby="keyDatesTitle">
      <h2 id="keyDatesTitle" class="key-dates-title">Key dates — Call 2027</h2>
      <ol id="phaseList" class="phase-list"></ol>
    </section>
  </main>

  <script src="script.js?v=5"></script>
</body>
</html>
